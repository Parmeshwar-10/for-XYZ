<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just For You</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
    
    <style>
        /* Same Pink Animated Background as Index */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle, #ff66a3, #ff1a75, #cc0052);
            background-size: 200% 200%;
            animation: pinkPulse 6s ease-in-out infinite alternate;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes pinkPulse {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Container for the lyrics */
        .lyrics-container {
            position: relative;
            width: 90%;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Animated Lyric Text */
        .lyric-line {
            position: absolute;
            font-family: 'Caveat', cursive;
            font-size: 3.5rem;
            text-align: center;
            opacity: 0; /* Hidden by default */
            
            /* Same beautiful blue gradient as your index page */
            background: linear-gradient(to bottom, #ffffff, #aee1ff, #33adff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3));
            
            /* The animation that makes them fade in and out */
            animation: fadeLyric 4s ease-in-out forwards;
        }

        /* Timing each lyric perfectly (4 seconds apart) */
        .lyric-line:nth-child(1) { animation-delay: 1s; }
        .lyric-line:nth-child(2) { animation-delay: 5s; }
        .lyric-line:nth-child(3) { animation-delay: 9s; }
        .lyric-line:nth-child(4) { animation-delay: 13s; }

        @keyframes fadeLyric {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            20% { opacity: 1; transform: translateY(0) scale(1); }
            80% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-20px) scale(1.05); }
        }

        /* The Button to go to the final page */
        .next-btn-wrapper {
            position: absolute;
            bottom: 25%;
            opacity: 0;
            /* Fades in after the last lyric finishes (at 17 seconds) */
            animation: fadeInBtn 2s ease-in forwards;
            animation-delay: 17s; 
            z-index: 20;
        }

        @keyframes fadeInBtn {
            to { opacity: 1; }
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .next-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.4);
        }

        /* Music Visualizer Bars at the bottom */
        .visualizer {
            position: absolute;
            bottom: 10%;
            display: flex;
            gap: 5px;
            align-items: flex-end;
            height: 40px;
        }

        .bar {
            width: 6px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            animation: bounceBar infinite ease-in-out alternate;
        }

        /* Randomizing the bounce for each bar to look like music */
        .bar:nth-child(1) { height: 10px; animation-duration: 0.4s; }
        .bar:nth-child(2) { height: 25px; animation-duration: 0.6s; }
        .bar:nth-child(3) { height: 15px; animation-duration: 0.5s; }
        .bar:nth-child(4) { height: 35px; animation-duration: 0.7s; }
        .bar:nth-child(5) { height: 20px; animation-duration: 0.45s; }
        .bar:nth-child(6) { height: 15px; animation-duration: 0.55s; }

        @keyframes bounceBar {
            0% { transform: scaleY(0.5); }
            100% { transform: scaleY(1.5); }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .lyric-line { font-size: 2.8rem; }
            .next-btn { font-size: 1.1rem; padding: 15px 35px; }
            .next-btn-wrapper { bottom: 20%; }
            .visualizer { bottom: 8%; }
        }
    </style>
</head>
<body>

    <div id="magic-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;"></div>

    <div class="lyrics-container">
        <div class="lyric-line">I was just thinking...</div>
        <div class="lyric-line">We share so many memes...</div>
        <div class="lyric-line">And talk so much...</div>
        <div class="lyric-line">But there is one thing missing.</div>
    </div>

    <div class="next-btn-wrapper">
        <a href="page2.html" class="next-btn">I have a question...</a>
    </div>

    <div class="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <script>
        // Creates soft, floating background hearts just like the main page
        const magicLayer = document.getElementById('magic-layer');

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤';
            heart.style.position = 'absolute';
            
            // Starts at the bottom
            heart.style.left = (Math.random() * 100) + 'vw';
            heart.style.top = '110vh'; 
            
            // Random sizes and transparency
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            heart.style.color = 'rgba(255, 255, 255, 0.4)';
            heart.style.transition = 'transform 6s linear, opacity 6s ease-out';
            
            magicLayer.appendChild(heart);

            // Trigger the float animation
            setTimeout(() => {
                heart.style.transform = `translateY(-120vh) rotate(${Math.random() * 360}deg)`;
                heart.style.opacity = '0';
            }, 10);

            // Clean up
            setTimeout(() => heart.remove(), 6000);
        }

        // Add a new heart every 400ms for a gentle background effect
        setInterval(createFloatingHeart, 400);
    </script>
</body>
</html>
