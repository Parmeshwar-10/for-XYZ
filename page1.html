<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just For You</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    
    <style>
        /* Rich, Fully Pink Animated Background */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle, #ff66a3, #ff1a75, #cc0052);
            background-size: 200% 200%;
            animation: pinkPulse 6s ease-in-out infinite alternate;
            overflow: hidden; 
        }

        @keyframes pinkPulse {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Top Hint Warning */
        .top-hint {
            position: absolute;
            top: 8%;
            width: 100%;
            text-align: center;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.9);
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.3rem;
            letter-spacing: 1.5px;
            animation: floatHint 2s infinite alternate;
            z-index: 20;
            pointer-events: none; 
        }

        @keyframes floatHint {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        /* Cute Stopwatch Timer */
        .cute-timer {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 30;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: opacity 1s ease; 
        }

        /* Centered Transparent Box Layout */
        .center-wrapper {
            position: absolute;
            top: 45%; 
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 85%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            pointer-events: none; 
        }

        .text-container {
            background: rgba(255, 255, 255, 0.25); 
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); 
            text-align: center;
            width: 100%;
            min-height: 120px; /* Keeps the box size stable when text disappears */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Typing Lyrics Text */
        .main-text {
            font-family: 'Caveat', cursive;
            font-size: 2.8rem; 
            margin: 0;
            line-height: 1.2;
            
            background: linear-gradient(to bottom, #ffffff, #aee1ff, #33adff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 0px; 
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3));
        }

        .cursor {
            color: #ffffff;
            animation: blink 1s infinite;
            -webkit-text-stroke: 0px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Secure Button Wrapper */
        .next-btn-wrapper {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            pointer-events: none; 
            transition: opacity 2s ease-in;
            z-index: 20;
            width: 100%;
            text-align: center;
        }

        .next-btn-wrapper.show {
            opacity: 1;
            pointer-events: auto; 
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: inline-block;
        }

        .next-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.4);
        }

        /* Widened Swaying Animation for Musical Notes */
        .sway-note {
            animation: sway 4s ease-in-out infinite alternate;
        }

        @keyframes sway {
            0% { transform: translateX(-80px) rotate(-20deg); }
            100% { transform: translateX(80px) rotate(20deg); }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .top-hint { font-size: 1rem; top: 8%; }
            .cute-timer { top: 15px; right: 15px; font-size: 0.9rem; padding: 6px 12px; }
            .text-container { padding: 20px 25px; min-height: 100px; }
            .main-text { font-size: 2.2rem; }
            .next-btn { font-size: 1.1rem; padding: 15px 35px; }
            .next-btn-wrapper { bottom: 10%; }
        }
    </style>
</head>
<body>

    <!-- REPLACED: Looks for song2.mp3 so it doesn't play the index page song! -->
    <audio id="bg-music" loop playsinline preload="auto">
        <source src="song2.mp3" type="audio/mpeg">
    </audio>

    <!-- Floating Background Layer -->
    <div id="magic-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;"></div>

    <!-- The Cute Countdown Stopwatch -->
    <div class="cute-timer" id="stopwatch">✨ 20s</div>

    <div class="top-hint">Please wait until the song ends... 🎶✨</div>

    <!-- The Transparent Box -->
    <div class="center-wrapper">
        <div class="text-container">
            <div class="main-text" id="typewriter-lyrics"></div>
        </div>
    </div>

    <!-- Button safely hidden until JS reveals it -->
    <div class="next-btn-wrapper" id="safe-button">
        <a href="page2.html" class="next-btn">I have a question for you...</a>
    </div>

    <script>
        // --- 1. THE REVERSE COUNTDOWN STOPWATCH ---
        const timerElement = document.getElementById('stopwatch');
        let currentSecond = 20; // Starts at 20

        const timerInterval = setInterval(() => {
            currentSecond--;
            if (currentSecond > 0) {
                timerElement.innerHTML = `✨ ${currentSecond}s`;
            } else {
                timerElement.innerHTML = `✨ 0s`;
                clearInterval(timerInterval); 
                // Fade out smoothly when it hits 0
                setTimeout(() => { timerElement.style.opacity = '0'; }, 500); 
            }
        }, 1000); 


        // --- 2. THE CLEAN LYRICS TYPEWRITER ENGINE (One line at a time) ---
        const lyricsLines = [
            "Jaante hue bhi anjaan banti ho,

is tarah mujhe pareshan karti ho,

puchti ho mujhe kya pasand hai,

jawab khud ho, phir bhi Sawaal karti ho ✨"
        ];
        
        const typingSpeed = 80; 
        const pauseBetweenLines = 1500; 

        const textElement = document.getElementById('typewriter-lyrics');
        let lineIndex = 0;
        let charIndex = 0;

        function typeLyric() {
            if (lineIndex < lyricsLines.length) {
                if (charIndex < lyricsLines[lineIndex].length) {
                    // Types the current line only
                    let currentText = lyricsLines[lineIndex].substring(0, charIndex + 1) + '<span class="cursor">|</span>';
                    textElement.innerHTML = currentText;
                    charIndex++;
                    
                    setTimeout(typeLyric, typingSpeed); 
                } else {
                    // Finishes the line, removes cursor, and pauses before clearing for the next line
                    textElement.innerHTML = lyricsLines[lineIndex];
                    
                    lineIndex++;
                    charIndex = 0;
                    
                    setTimeout(typeLyric, pauseBetweenLines); 
                }
            } else {
                // Leaves the final line on the screen
                textElement.innerHTML = lyricsLines[lyricsLines.length - 1];
            }
        }

        setTimeout(typeLyric, 1000);


        // --- 3. BULLETPROOF ANDROID AUDIO UNLOCKER ---
        let musicStarted = false;
        const bgMusic = document.getElementById('bg-music');

        function unlockAudio() {
            if (!musicStarted && bgMusic) {
                const playPromise = bgMusic.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        musicStarted = true;
                        document.removeEventListener('touchstart', unlockAudio);
                        document.removeEventListener('click', unlockAudio);
                    }).catch(() => {});
                }
            }
        }
        
        document.addEventListener('touchstart', unlockAudio, { passive: true });
        document.addEventListener('click', unlockAudio);


        // --- 4. IMPROVED, WANDERING MUSICAL NOTES ---
        const magicLayer = document.getElementById('magic-layer');

        function createFloatingNote() {
            const wrapper = document.createElement('div');
            wrapper.style.position = 'absolute';
            wrapper.style.left = (Math.random() * 100) + 'vw';
            wrapper.style.top = '110vh'; 
            wrapper.style.transition = 'transform 6s linear, opacity 0.5s ease-out 5.5s';
            
            const note = document.createElement('div');
            const notes = ['🎵', '🎶', '🎼'];
            note.innerHTML = notes[Math.floor(Math.random() * notes.length)];
            
            // Reduced size for a cleaner look
            note.style.fontSize = (Math.random() * 15 + 10) + 'px'; 
            note.style.opacity = '1';
            note.style.filter = 'drop-shadow(0 0 5px rgba(255,255,255,0.6))';
            
            note.classList.add('sway-note');
            note.style.animationDuration = (Math.random() * 2 + 3) + 's';
            note.style.animationDelay = '-' + (Math.random() * 2) + 's';

            wrapper.appendChild(note);
            magicLayer.appendChild(wrapper);

            setTimeout(() => {
                wrapper.style.transform = `translateY(-120vh)`;
                wrapper.style.opacity = '0';
            }, 10);

            setTimeout(() => wrapper.remove(), 6000);
        }

        // Reduced spawn rate so there are fewer notes on the screen
        setInterval(createFloatingNote, 400);

        // --- 5. THE 20-SECOND BUTTON REVEAL ---
        setTimeout(() => {
            document.getElementById('safe-button').classList.add('show');
        }, 20000); 
    </script>
</body>
</html>
