<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just For You</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
    
    <style>
        /* Rich, Fully Pink Animated Background */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle, #ff66a3, #ff1a75, #cc0052);
            background-size: 200% 200%;
            animation: pinkPulse 6s ease-in-out infinite alternate;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes pinkPulse {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* The Main Content Container */
        .main-container {
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px; 
        }

        /* The Question Text */
        .main-text {
            font-family: 'Caveat', cursive;
            font-size: 3.8rem; 
            margin: 0;
            line-height: 1.1;
            
            background: linear-gradient(to bottom, #ffffff, #aee1ff, #33adff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 0px; 
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3));
            transition: all 0.5s ease; 
        }

        /* The Kitten GIF Box */
        .gif-container {
            width: 220px;
            height: 220px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background-color: #ffffff; /* Gives it a clean white background while loading */
        }

        /* Makes the image fill the box perfectly */
        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; 
        }

        /* Buttons Wrapper */
        .buttons-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            z-index: 20;
            width: 100%;
            min-height: 60px; 
        }

        /* The Buttons styling */
        .btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 12px 45px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
            user-select: none;
        }

        /* YES Button Specifics */
        #yes-btn:active {
            transform: scale(0.90);
            background: rgba(255, 255, 255, 0.5);
        }

        /* NO Button Specifics */
        #no-btn {
            position: relative; 
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .main-text { font-size: 3rem; }
            .gif-container { width: 180px; height: 180px; }
            .btn { font-size: 1.2rem; padding: 12px 35px; }
            .buttons-wrapper { gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <h1 class="main-text" id="question-text">Will you go on a<br>coffee date with me?</h1>
        
        <div class="gif-container" id="gif-box">
            <img id="main-gif" src="https://media.tenor.com/TKJoB2E6GjMAAAAi/peach-goma.gif" alt="Cute Kittens">
        </div>
        
        <div class="buttons-wrapper" id="btn-group">
            <button class="btn" id="yes-btn">YES</button>
            <button class="btn" id="no-btn">NO</button>
        </div>

    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const questionText = document.getElementById('question-text');
        const btnGroup = document.getElementById('btn-group');
        const mainGif = document.getElementById('main-gif');
        const gifBox = document.getElementById('gif-box');

        // --- 1. THE RUNAWAY "NO" BUTTON LOGIC ---
        function runAway(e) {
            if (e) e.preventDefault(); 
            
            noBtn.style.position = 'absolute';
            
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.max(10, Math.floor(Math.random() * maxX));
            const randomY = Math.max(10, Math.floor(Math.random() * maxY));
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', runAway);
        noBtn.addEventListener('touchstart', runAway, { passive: false });
        noBtn.addEventListener('click', runAway);


        // --- 2. THE "YES" BUTTON VICTORY LOGIC ---
        yesBtn.addEventListener('click', () => {
            // Change the text to a Victory message
            questionText.innerHTML = "Yayy! I knew it! <br> It's a date! 🎉💙";
            
            // Hide the buttons smoothly
            btnGroup.style.transition = "opacity 0.5s ease";
            btnGroup.style.opacity = "0";
            setTimeout(() => { btnGroup.style.display = "none"; }, 500);

            // Swap the GIF to a happy, celebrating couple kitten GIF!
            mainGif.src = "https://media.tenor.com/YwE_jBps97EAAAAC/peach-goma.gif";
            
            // Give the GIF box a happy little bounce
            gifBox.style.transform = "scale(1.1)";
            setTimeout(() => { gifBox.style.transform = "scale(1)"; }, 300);

            // Trigger the massive central Party Popper explosion!
            triggerPartyPopper();
        });


        // --- 3. THE CENTRAL PARTY POPPER BURST ---
        function triggerPartyPopper() {
            // Glitter colors
            const colors = ['#FFD700', '#FF66A3', '#33ADFF', '#FFFFFF', '#00E5FF'];
            const numConfetti = 120; 
            
            for (let i = 0; i < numConfetti; i++) {
                const confetti = document.createElement('div');
                
                // Randomly create circular glitter or rectangular confetti
                if (Math.random() > 0.5) {
                    confetti.style.width = (Math.random() * 8 + 5) + 'px';
                    confetti.style.height = confetti.style.width;
                    confetti.style.borderRadius = '50%';
                } else {
                    confetti.style.width = (Math.random() * 8 + 5) + 'px';
                    confetti.style.height = (Math.random() * 12 + 8) + 'px';
                }
                
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.position = 'absolute';
                
                // Start exactly in the center of the screen
                confetti.style.left = '50%';
                confetti.style.top = '50%';
                confetti.style.zIndex = '100';
                confetti.style.pointerEvents = 'none'; 
                document.body.appendChild(confetti);

                // Math to make them explode OUTWARDS in 360 degrees
                const angle = Math.random() * Math.PI * 2;
                const velocity = 150 + Math.random() * 300; 
                
                const tx = Math.cos(angle) * velocity;
                // Add a slight upward burst before gravity pulls it down
                const ty = Math.sin(angle) * velocity - (Math.random() * 100); 
                const rot = Math.random() * 720;

                // Animate them shooting out, slowing down, and fading
                confetti.animate([
                    { transform: 'translate(-50%, -50%) rotate(0deg)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${rot}deg)`, opacity: 1, offset: 0.7 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty + 150}px)) rotate(${rot + 180}deg)`, opacity: 0 } 
                ], {
                    duration: 1500 + Math.random() * 1500, 
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)', 
                    fill: 'forwards'
                });

                // Clean up DOM
                setTimeout(() => confetti.remove(), 3000);
            }
        }
    </script>
</body>
</html>
