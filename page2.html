<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just For You</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    
    <style>
        /* Exact same Pink Animated Background */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle, #ff66a3, #ff1a75, #cc0052);
            background-size: 200% 200%;
            animation: pinkPulse 6s ease-in-out infinite alternate;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes pinkPulse {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* The Main Question Container */
        .question-container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            animation: float 3s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }

        /* The Big Question Text */
        .main-text {
            font-family: 'Caveat', cursive;
            font-size: 4rem; 
            margin: 0 0 30px 0;
            line-height: 1.2;
            
            background: linear-gradient(to bottom, #ffffff, #aee1ff, #33adff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 0px; 
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3));
        }

        /* Buttons Wrapper */
        .buttons-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            z-index: 20;
            min-height: 60px; /* Keeps layout stable when NO button runs away */
        }

        /* The Buttons styling */
        .btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px 45px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
            user-select: none;
        }

        /* YES Button Specifics */
        #yes-btn:active {
            transform: scale(0.90);
            background: rgba(255, 255, 255, 0.5);
        }

        /* NO Button Specifics */
        #no-btn {
            position: relative; /* Changes to absolute dynamically via JS */
        }

        /* Floating Background Layers (For the final celebration) */
        #celebration-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .main-text { font-size: 3rem; }
            .btn { font-size: 1.2rem; padding: 12px 35px; }
            .buttons-wrapper { gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- Celebration Layer for when she clicks YES -->
    <div id="celebration-layer"></div>

    <!-- The Main Content -->
    <div class="question-container">
        <h1 class="main-text" id="question-text">Will you go on a<br>coffee date with me?</h1>
        
        <div class="buttons-wrapper" id="btn-group">
            <button class="btn" id="yes-btn">YES</button>
            <button class="btn" id="no-btn">NO</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const questionText = document.getElementById('question-text');
        const btnGroup = document.getElementById('btn-group');
        const celebrationLayer = document.getElementById('celebration-layer');

        // --- 1. THE RUNAWAY "NO" BUTTON LOGIC ---
        function runAway(e) {
            // Prevent the default click/touch so it doesn't accidentally trigger
            if (e) e.preventDefault(); 
            
            // Pull the button out of the normal layout so it can fly anywhere
            noBtn.style.position = 'absolute';
            
            // Calculate random positions, keeping it inside the screen bounds
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.max(10, Math.floor(Math.random() * maxX));
            const randomY = Math.max(10, Math.floor(Math.random() * maxY));
            
            // Apply the new position instantly
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Trigger the run away on both mouse hover (laptop) and touch (mobile)
        noBtn.addEventListener('mouseover', runAway);
        noBtn.addEventListener('touchstart', runAway, { passive: false });
        noBtn.addEventListener('click', runAway); // Just in case!


        // --- 2. THE "YES" BUTTON VICTORY LOGIC ---
        yesBtn.addEventListener('click', () => {
            // 1. Change the text to a cute victory message
            questionText.innerHTML = "I knew you'd say YES! <br> It's a date! ☕💙";
            
            // 2. Hide the buttons smoothly
            btnGroup.style.transition = "opacity 0.5s ease";
            btnGroup.style.opacity = "0";
            setTimeout(() => { btnGroup.style.display = "none"; }, 500);

            // 3. Trigger the massive celebration shower!
            triggerCelebration();
        });


        // --- 3. THE CONFETTI/EMOJI SHOWER ---
        function triggerCelebration() {
            const emojis = ['💖', '☕', '✨', '🎉', '💙', '🥰'];
            
            // Create 60 falling emojis
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    
                    // Pick a random emoji
                    confetti.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                    
                    // Randomize size, starting position, and fall speed
                    confetti.style.left = (Math.random() * 100) + 'vw';
                    confetti.style.top = '-10vh'; // Start above screen
                    confetti.style.fontSize = (Math.random() * 20 + 15) + 'px';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    
                    celebrationLayer.appendChild(confetti);

                    // Remove them from the code after they fall to keep the page clean
                    setTimeout(() => {
                        confetti.remove();
                    }, 4000);
                }, i * 50); // Staggers them so they fall in a continuous shower
            }
        }
    </script>
</body>
</html>
