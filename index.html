<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
    
    <style>
        /* Rich, Fully Pink Animated Background */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle, #ff66a3, #ff1a75, #cc0052);
            background-size: 200% 200%;
            animation: pinkPulse 6s ease-in-out infinite alternate;
            overflow: hidden; 
            perspective: 1000px;
        }

        @keyframes pinkPulse {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Centered Box */
        .center-wrapper {
            position: absolute;
            top: 35%; 
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column; /* Added to stack the text above the box */
            align-items: center;    /* Added to keep everything perfectly centered */
            justify-content: center;
            pointer-events: none; 
        }

        /* NEW: Tap Hint Text */
        .tap-hint {
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.9);
            font-family: 'Arial', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            animation: floatHint 2s infinite alternate;
        }

        /* The transparent box */
        .text-container {
            background: rgba(255, 255, 255, 0.25); 
            padding: 25px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); 
            text-align: center;
        }

        /* The Main Text - Handwritten with Smooth Blue Gradient */
        .main-text {
            font-family: 'Caveat', cursive;
            font-size: 3.5rem; 
            margin: 0;
            
            /* Beautiful gradient from white to sky blue to deep blue */
            background: linear-gradient(to bottom, #ffffff, #aee1ff, #33adff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 0px; 
            
            /* Soft shadow to make it pop off the pink */
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3));
            letter-spacing: 2px;
            min-height: 70px;
        }

        .cursor {
            color: #ffffff;
            animation: blink 1s infinite;
            -webkit-text-stroke: 0px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Scratch Button Wrapper */
        .bottom-wrapper {
            position: absolute;
            bottom: 70px; 
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20; 
        }

        /* Instruction text */
        .scratch-hint {
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Arial', sans-serif;
            font-size: 1rem;
            margin-bottom: 15px;
            animation: floatHint 2s infinite alternate;
            pointer-events: none;
        }

        @keyframes floatHint {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        /* The Button Area */
        .heart-btn {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 140px; 
            height: 140px;
            cursor: pointer;
            touch-action: none; 
        }

        /* The Gift Emoji */
        #gift-emoji {
            font-size: 110px;
            line-height: 1;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
            transition: all 0.1s ease;
            user-select: none;
        }

        /* Custom Footer: Transparent text with solid blue heart */
        .footer-text {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-family: 'Arial', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 10;
            pointer-events: none;
        }

        .transparent-words {
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.8);
        }

        /* Background and Magic Animation layers */
        .heart-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        
        .magic-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
        }

        .mini-heart {
            position: absolute;
            opacity: 0;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.7));
        }

        @keyframes popUpwards {
            0% { transform: translateY(110vh) scale(0.2); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(2.0); opacity: 0; }
        }

        /* MOBILE ADJUSTMENTS */
        @media (max-width: 600px) {
            .text-container { 
                padding: 15px 20px; 
                width: 85%; 
                box-sizing: border-box; 
            }
            .main-text { 
                font-size: 1.8rem; 
                line-height: 1.3; 
                -webkit-text-stroke: 0px; 
            }
            
            /* Moves the text box much higher up on the screen */
            .center-wrapper { top: 30%; } 
            
            /* Moves the gift box button to the middle-lower portion (above the bottom) */
            .bottom-wrapper { bottom: 15%; } 
            
            .heart-btn { width: 120px; height: 120px; }
            #gift-emoji { font-size: 95px; } 
            .btn-text { font-size: 1.2rem; }
            .footer-text { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop playsinline preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="heart-container" id="heart-container"></div>
    <div class="magic-layer" id="magic-layer"></div>

    <div class="center-wrapper">
        <div class="tap-hint">Tap anywhere on the screen! ✨</div>
        <div class="text-container" id="tilt-box">
            <div class="main-text" id="typewriter-text"></div>
        </div>
    </div>
    
    <div class="bottom-wrapper">
        <div class="scratch-hint"> Scratch the gift to open...</div>
        <div class="heart-btn" id="scratch-btn" aria-label="Next Page">
            <span id="gift-emoji">🎁</span>
            <span class="btn-text"></span>
        </div>
    </div>

    <div class="footer-text">
        <span class="transparent-words">made with</span> 💙 <span class="transparent-words">by Priyanjali</span>
    </div>

    <script>
        // --- 1. TYPEWRITER EFFECT ---
        const textElement = document.getElementById('typewriter-text');
        const textToType = "Hello Ramkrishna! I've been working on a digital surprise  for you. Make sure your volume is up, take your time, and please go through all the pages.. there is something special at the very end! ✨"; 
        let typeIndex = 0;

        function typeWriter() {
            if (!textElement) return;
            if (typeIndex < textToType.length) {
                textElement.innerHTML = textToType.substring(0, typeIndex + 1) + '<span class="cursor">|</span>';
                typeIndex++;
                setTimeout(typeWriter, 100); 
            } else {
                textElement.innerHTML = textToType; 
            }
        }
        setTimeout(typeWriter, 500); 

        // --- 2. BACKGROUND HEARTS: POPPING UP & GROWING ---
        function createMiniHeart() {
            const container = document.getElementById('heart-container');
            if (!container) return;
            const heart = document.createElement('div');
            heart.classList.add('mini-heart');
            heart.innerHTML = '❤';
            const colors = ['#ffffff', '#ffffff', '#ff0000', '#ff1a75'];
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];
            
            heart.style.left = (Math.random() * 100) + 'vw';
            heart.style.fontSize = '20px'; 
            
            const duration = Math.random() * 3 + 3; 
            heart.style.animation = `popUpwards ${duration}s ease-in infinite`;
            
            container.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }
        setInterval(createMiniHeart, 150);

        // --- 3. BULLETPROOF ANDROID AUDIO UNLOCKER ---
        let musicStarted = false;
        const bgMusic = document.getElementById('bg-music');

        function unlockAudio() {
            if (!musicStarted && bgMusic) {
                const playPromise = bgMusic.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        musicStarted = true;
                        // Once music starts, remove these triggers so it doesn't run repeatedly
                        document.removeEventListener('touchstart', unlockAudio);
                        document.removeEventListener('click', unlockAudio);
                    }).catch(() => {
                        // Browser waiting for stronger interaction
                    });
                }
            }
        }
        
        // This guarantees the music starts no matter where you touch (even the gift box)
        document.addEventListener('touchstart', unlockAudio, { passive: true });
        document.addEventListener('click', unlockAudio);


        // --- 4. HIGH-SENSITIVITY TOUCH HEARTBURST ---
        const magicLayer = document.getElementById('magic-layer');

        function createBurst(x, y) {
            for (let i = 0; i < 15; i++) {
                const burstHeart = document.createElement('div');
                burstHeart.innerHTML = '❤';
                burstHeart.style.position = 'absolute';
                burstHeart.style.left = x + 'px';
                burstHeart.style.top = y + 'px';
                burstHeart.style.color = Math.random() > 0.5 ? '#ffffff' : '#ff0000';
                burstHeart.style.fontSize = (Math.random() * 25 + 10) + 'px';
                burstHeart.style.pointerEvents = 'none';
                burstHeart.style.transition = 'all 0.8s cubic-bezier(0.1, 0.8, 0.3, 1)';
                magicLayer.appendChild(burstHeart);

                setTimeout(() => {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 80 + 30; 
                    burstHeart.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0)`;
                    burstHeart.style.opacity = '0';
                }, 10);

                setTimeout(() => burstHeart.remove(), 800);
            }
        }

        document.addEventListener('mousedown', (e) => {
            if (!e.target.closest('#scratch-btn')) {
                createBurst(e.clientX, e.clientY);
            }
        });
        
        document.addEventListener('touchstart', (e) => {
            if (!e.target.closest('#scratch-btn')) {
                createBurst(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });


        // --- 5. SCRATCH TO OPEN (GIFT BOX EFFECTS) ---
        const scratchBtn = document.getElementById('scratch-btn');
        const giftEmoji = document.getElementById('gift-emoji');
        let scratchProgress = 0;
        const scratchThreshold = 25; 
        let isRedirecting = false;

        function triggerNextPage() {
            if (isRedirecting) return;
            isRedirecting = true;
            
            scratchBtn.style.transform = 'scale(2)';
            scratchBtn.style.opacity = '0';
            scratchBtn.style.transition = 'all 0.6s ease-out';
            
            setTimeout(() => {
                window.location.href = 'page1.html';
            }, 600);
        }

        function handleScratch() {
            if (isRedirecting) return;
            scratchProgress++;

            // Makes the gift box shake and glow as they scratch it!
            const intensity = Math.min(scratchProgress / scratchThreshold, 1);
            giftEmoji.style.filter = `drop-shadow(0 0 ${10 + (intensity * 30)}px rgba(255, 255, 255, 0.9))`;
            giftEmoji.style.transform = `scale(${1 + (intensity * 0.1)}) rotate(${(Math.random() - 0.5) * 15}deg)`;

            if (scratchProgress >= scratchThreshold) {
                triggerNextPage();
            }
        }

        scratchBtn.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            handleScratch();
        }, { passive: false });

        scratchBtn.addEventListener('mousemove', (e) => {
            if (e.buttons > 0) { 
                handleScratch();
            }
        });

        scratchBtn.addEventListener('click', () => {
            scratchProgress += 5; 
            handleScratch();
        });
    </script>
</body>
</html>
