<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Rich, Fully Pink Animated Background */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle, #ff66a3, #ff1a75, #cc0052);
            background-size: 200% 200%;
            animation: pinkPulse 6s ease-in-out infinite alternate;
            overflow: hidden; 
            perspective: 1000px;
            touch-action: none; /* Prevents accidental scrolling while scratching */
        }

        @keyframes pinkPulse {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Centered Box - Adjusted to be higher up */
        .center-wrapper {
            position: absolute;
            top: 35%; 
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Smaller, more elegant transparent box */
        .text-container {
            background: rgba(255, 255, 255, 0.25); 
            padding: 25px 50px; /* Reduced padding */
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); 
            text-align: center;
            transition: transform 0.1s ease-out; 
            transform-style: preserve-3d;
        }

        /* Smaller Main Text */
        .main-text {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem; /* Decreased from 5rem */
            margin: 0;
            color: transparent; 
            -webkit-text-stroke: 2px #ffffff; /* Slightly thinner outline */
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            letter-spacing: 2px;
            min-height: 70px;
        }

        .cursor {
            color: #ffffff;
            animation: blink 1s infinite;
            -webkit-text-stroke: 0px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Scratch Button Wrapper */
        .bottom-wrapper {
            position: absolute;
            bottom: 70px; /* Shifted up to make room for the footer */
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20; /* High z-index so it's easily touchable */
        }

        /* Small instruction text above the button */
        .scratch-hint {
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Arial', sans-serif;
            font-size: 1rem;
            margin-bottom: 10px;
            animation: floatHint 2s infinite alternate;
            pointer-events: none;
        }

        @keyframes floatHint {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        /* The Blue Heart Button */
        .heart-btn {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 140px; 
            height: 140px;
            cursor: pointer;
            transition: transform 0.1s ease;
            animation: pulseBtn 1.5s infinite;
        }

        .heart-btn svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            fill: #0077ff; /* Beautiful vivid blue */
            filter: drop-shadow(0 10px 20px rgba(0, 119, 255, 0.6));
            z-index: 1;
            transition: all 0.2s ease;
        }

        .btn-text {
            position: relative;
            z-index: 2; 
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: -15px; 
            pointer-events: none; /* Let touches pass through to the button */
        }

        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Bottom Footer Text */
        .footer-text {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Arial', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            z-index: 10;
            pointer-events: none;
        }

        /* Background and Magic Animation layers */
        .heart-container, .magic-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .mini-heart {
            position: absolute;
            opacity: 0;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.7));
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .text-container { padding: 20px 30px; }
            .main-text { font-size: 2.5rem; -webkit-text-stroke: 1.5px #ffffff; }
            .bottom-wrapper { bottom: 60px; }
            .heart-btn { width: 120px; height: 120px; }
            .btn-text { font-size: 1.2rem; margin-top: -10px; }
            .center-wrapper { top: 35%; } 
            .footer-text { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="heart-container" id="heart-container"></div>
    <div class="magic-layer" id="magic-layer"></div>

    <div class="center-wrapper">
        <div class="text-container" id="tilt-box">
            <div class="main-text" id="typewriter-text"></div>
        </div>
    </div>
    
    <div class="bottom-wrapper">
        <div class="scratch-hint">Scratch the heart to open...</div>
        <div class="heart-btn" id="scratch-btn" aria-label="Next Page">

            </svg>
            <span class="btn-text">XYZ</span>
        </div>
    </div>

    <div class="footer-text">made with love by parm 💙</div>

    <script>
        // --- 1. TYPEWRITER EFFECT ---
        const textElement = document.getElementById('typewriter-text');
        const textToType = "XYZ"; 
        let typeIndex = 0;

        function typeWriter() {
            if (typeIndex < textToType.length) {
                textElement.innerHTML = textToType.substring(0, typeIndex + 1) + '<span class="cursor">|</span>';
                typeIndex++;
                setTimeout(typeWriter, 200); 
            } else {
                textElement.innerHTML = textToType; 
            }
        }
        setTimeout(typeWriter, 800); 

        // --- 2. 3D HOVER TILT ---
        const tiltBox = document.getElementById('tilt-box');
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 30;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 30;
            tiltBox.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // --- 3. BACKGROUND HEARTS ---
        function createMiniHeart() {
            const container = document.getElementById('heart-container');
            const heart = document.createElement('div');
            heart.classList.add('mini-heart');
            heart.innerHTML = '❤';
            const colors = ['#ffffff', '#ffffff', '#ff0000', '#ff1a75'];
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];
            heart.style.fontSize = (Math.random() * 40 + 15) + 'px';
            heart.style.left = (Math.random() * 100) + 'vw';
            const duration = Math.random() * 4 + 3;
            heart.style.animation = `floatUp ${duration}s ease-in infinite`;
            container.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }
        setInterval(createMiniHeart, 150);

        // --- 4. MAGIC CURSOR TRAIL ---
        const magicLayer = document.getElementById('magic-layer');
        function createTrail(x, y) {
            if (Math.random() > 0.4) return; 
            const sparkle = document.createElement('div');
            sparkle.innerHTML = '✨';
            sparkle.style.position = 'absolute';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            sparkle.style.fontSize = '15px';
            sparkle.style.pointerEvents = 'none';
            sparkle.style.transition = 'all 0.5s ease-out';
            magicLayer.appendChild(sparkle);

            setTimeout(() => {
                sparkle.style.transform = 'translateY(-20px) scale(0)';
                sparkle.style.opacity = '0';
            }, 10);
            setTimeout(() => sparkle.remove(), 500);
        }
        document.addEventListener('mousemove', (e) => createTrail(e.clientX, e.clientY));
        document.addEventListener('touchmove', (e) => createTrail(e.touches[0].clientX, e.touches[0].clientY));

        // --- 5. HYPER-SENSITIVE HEARTBURST ON TOUCH & MUSIC ---
        let musicStarted = false;
        // Using "pointerdown" makes it react instantly the millisecond they touch the screen
        document.addEventListener('pointerdown', (e) => {
