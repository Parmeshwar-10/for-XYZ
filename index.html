<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Rich, Fully Pink Animated Background */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle, #ff66a3, #ff1a75, #cc0052);
            background-size: 200% 200%;
            animation: pinkPulse 6s ease-in-out infinite alternate;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes pinkPulse {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Wrapper to keep everything centered */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 40px; /* Space between the text box and the heart button */
            width: 100%;
            text-align: center;
        }

        /* Transparent Glass Screen for the Text */
        .text-container {
            background: rgba(255, 255, 255, 0.15); /* Very subtle transparent background */
            backdrop-filter: blur(10px); /* Blurs the pink background behind it slightly */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4); /* Thin, soft border */
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        /* The Transparent Text with White Outline */
        .main-text {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem; 
            margin: 0;
            color: transparent; 
            -webkit-text-stroke: 3px #ffffff; 
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            letter-spacing: 2px;
        }

        /* The Heart-Shaped Button */
        .heart-btn {
            display: inline-block;
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: pulseBtn 1.5s infinite;
            text-decoration: none; /* Removes any link underlines */
        }

        .heart-btn svg {
            width: 100%;
            height: 100%;
            fill: #ff0040; /* Vivid red-pink for the button */
            filter: drop-shadow(0 15px 25px rgba(255, 0, 64, 0.7)); /* Glowing shadow */
        }

        /* Button Hover and Click Effects */
        .heart-btn:hover {
            transform: scale(1.15);
        }
        
        .heart-btn:active {
            transform: scale(0.9);
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Background Floating Hearts */
        .heart-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .mini-heart {
            position: absolute;
            opacity: 0;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; }
        }
        
        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .text-container { padding: 30px 40px; }
            .main-text { font-size: 3.5rem; -webkit-text-stroke: 2px #ffffff; }
            .heart-btn { width: 80px; height: 80px; }
        }
    </style>
</head>
<body>

    <div class="heart-container" id="heart-container"></div>

    <div class="content-wrapper">
        
        <div class="text-container">
            <div class="main-text">XYZ</div>
        </div>
        
        <a href="page1.html" class="heart-btn" aria-label="Next Page">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </a>

    </div>

    <script>
        function createMiniHeart() {
            const container = document.getElementById('heart-container');
            const heart = document.createElement('div');
            heart.classList.add('mini-heart');
            heart.innerHTML = '❤';

            const colors = ['#ffffff', '#ff99cc', '#ff3385', '#ffb3d9'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            const size = Math.random() * 40 + 15; 
            const left = Math.random() * 100; 
            const duration = Math.random() * 5 + 3; 

            heart.style.color = randomColor;
            heart.style.fontSize = size + 'px';
            heart.style.left = left + 'vw';
            heart.style.animation = `floatUp ${duration}s ease-in infinite`;

            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createMiniHeart, 300);
    </script>
</body>
</html>
