<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Rich, Fully Pink Animated Background */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle, #ff66a3, #ff1a75, #cc0052);
            background-size: 200% 200%;
            animation: pinkPulse 6s ease-in-out infinite alternate;
            overflow: hidden; 
            perspective: 1000px; /* Needed for the 3D hover effect */
        }

        @keyframes pinkPulse {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Moved the box higher up to 35% instead of 50% */
        .center-wrapper {
            position: absolute;
            top: 35%; 
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* The transparent box, now with 3D transition properties */
        .text-container {
            background: rgba(255, 255, 255, 0.25); 
            padding: 40px 70px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); 
            text-align: center;
            transition: transform 0.1s ease-out; /* Makes the 3D tilt smooth */
            transform-style: preserve-3d;
        }

        /* The Text */
        .main-text {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem; 
            margin: 0;
            color: transparent; 
            -webkit-text-stroke: 3px #ffffff; 
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            letter-spacing: 2px;
            min-height: 100px; /* Keeps the box from resizing while typing */
        }

        /* Blinking cursor for the typewriter effect */
        .cursor {
            color: #ffffff;
            animation: blink 1s infinite;
            -webkit-text-stroke: 0px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* The Heart-Shaped Button */
        .bottom-wrapper {
            position: absolute;
            bottom: 40px; 
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .heart-btn {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 140px; 
            height: 140px;
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: pulseBtn 1.5s infinite;
            text-decoration: none; 
        }

        .heart-btn svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            fill: #ff0000; 
            filter: drop-shadow(0 10px 20px rgba(255, 0, 0, 0.5));
            z-index: 1;
        }

        .btn-text {
            position: relative;
            z-index: 2; 
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: -15px; 
        }

        .heart-btn:hover { transform: scale(1.15); }
        .heart-btn:active { transform: scale(0.9); }

        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Background and Magic Animation layers */
        .heart-container, .magic-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .mini-heart {
            position: absolute;
            opacity: 0;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.7));
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .text-container { padding: 30px 40px; }
            .main-text { font-size: 3.5rem; -webkit-text-stroke: 2px #ffffff; }
            .bottom-wrapper { bottom: 25px; }
            .heart-btn { width: 120px; height: 120px; }
            .btn-text { font-size: 1.2rem; margin-top: -10px; }
            .center-wrapper { top: 40%; } /* Slightly lower on mobile so it doesn't hit the top */
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="your-song.mp3" type="audio/mpeg">
    </audio>

    <div class="heart-container" id="heart-container"></div>
    <div class="magic-layer" id="magic-layer"></div>

    <div class="center-wrapper">
        <div class="text-container" id="tilt-box">
            <div class="main-text" id="typewriter-text"></div>
        </div>
    </div>
    
    <div class="bottom-wrapper">
        <a href="page1.html" class="heart-btn" aria-label="Next Page">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span class="btn-text">XYZ</span>
        </a>
    </div>

    <script>
        // --- 1. TYPEWRITER EFFECT ---
        const textElement = document.getElementById('typewriter-text');
        const textToType = "hello everyone this side your lovely parmeshwar"; // You will change this to your message later
        let typeIndex = 0;

        function typeWriter() {
            if (typeIndex < textToType.length) {
                textElement.innerHTML = textToType.substring(0, typeIndex + 1) + '<span class="cursor">|</span>';
                typeIndex++;
                setTimeout(typeWriter, 200); // Speed of typing
            } else {
                textElement.innerHTML = textToType; // Remove cursor when done
            }
        }
        setTimeout(typeWriter, 800); // Wait a moment before starting to type

        // --- 2. 3D HOVER TILT FOR LAPTOPS ---
        const tiltBox = document.getElementById('tilt-box');
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 30;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 30;
            tiltBox.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // --- 3. BACKGROUND HEARTS ---
        function createMiniHeart() {
            const container = document.getElementById('heart-container');
            const heart = document.createElement('div');
            heart.classList.add('mini-heart');
            heart.innerHTML = '❤';
            const colors = ['#ffffff', '#ffffff', '#ff0000', '#ff1a75'];
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];
            heart.style.fontSize = (Math.random() * 40 + 15) + 'px';
            heart.style.left = (Math.random() * 100) + 'vw';
            const duration = Math.random() * 4 + 3;
            heart.style.animation = `floatUp ${duration}s ease-in infinite`;
            container.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }
        setInterval(createMiniHeart, 150);

        // --- 4. MAGIC CURSOR TRAIL ---
        const magicLayer = document.getElementById('magic-layer');
        function createTrail(x, y) {
            if (Math.random() > 0.4) return; // Keeps the trail from getting too clustered
            const sparkle = document.createElement('div');
            sparkle.innerHTML = '✨';
            sparkle.style.position = 'absolute';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            sparkle.style.fontSize = '15px';
            sparkle.style.pointerEvents = 'none';
            sparkle.style.transition = 'all 0.5s ease-out';
            magicLayer.appendChild(sparkle);

            setTimeout(() => {
                sparkle.style.transform = 'translateY(-20px) scale(0)';
                sparkle.style.opacity = '0';
            }, 10);
            setTimeout(() => sparkle.remove(), 500);
        }
        document.addEventListener('mousemove', (e) => createTrail(e.clientX, e.clientY));
        document.addEventListener('touchmove', (e) => createTrail(e.touches[0].clientX, e.touches[0].clientY));

        // --- 5. HEARTBURST ON CLICK & 6. PLAY MUSIC ---
        let musicStarted = false;
        document.addEventListener('click', (e) => {
            // Trigger Music
            if (!musicStarted) {
                const bgMusic = document.getElementById('bg-music');
                bgMusic.play().catch(() => {
                    console.log("Browser blocked autoplay, needs direct user interaction on a button.");
                });
                musicStarted = true;
            }

            // Create Heartburst
            for (let i = 0; i < 8; i++) {
                const burstHeart = document.createElement('div');
                burstHeart.innerHTML = '❤';
                burstHeart.style.position = 'absolute';
                burstHeart.style.left = e.clientX + 'px';
                burstHeart.style.top = e.clientY + 'px';
                burstHeart.style.color = Math.random() > 0.5 ? '#ffffff' : '#ff0000';
                burstHeart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                burstHeart.style.pointerEvents = 'none';
                burstHeart.style.transition = 'all 0.8s ease-out';
                magicLayer.appendChild(burstHeart);

                // Calculate random outward explosion
                setTimeout(() => {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 60 + 20;
                    burstHeart.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0)`;
                    burstHeart.style.opacity = '0';
                }, 10);

                setTimeout(() => burstHeart.remove(), 800);
            }
        });
    </script>
</body>
</html>
