<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Rich, Fully Pink Animated Background */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            /* A deep, romantic pink gradient that pulses */
            background: radial-gradient(circle, #ff66a3, #ff1a75, #cc0052);
            background-size: 200% 200%;
            animation: pinkPulse 6s ease-in-out infinite alternate;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes pinkPulse {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Wrapper to stack everything cleanly without a background box */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 20px;
            width: 100%;
            text-align: center;
        }

        /* The Massive Beating Heart */
        .big-heart {
            font-size: 160px; /* Massively increased size */
            color: #ff0040; /* Deep, vivid red-pink */
            margin: 0;
            /* Adding a heavy glow around the heart */
            filter: drop-shadow(0 0 25px rgba(255, 0, 64, 0.8));
            animation: strongHeartbeat 1s infinite;
        }

        /* Stronger Heartbeat Animation */
        @keyframes strongHeartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1.1); }
            45% { transform: scale(1.35); }
        }

        /* Transparent Text with White Outline */
        .main-text {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem; /* Much larger */
            margin: 10px 0 30px 0;
            
            /* The Transparent Effect */
            color: transparent; 
            -webkit-text-stroke: 3px #ffffff; /* Thick white outline */
            
            /* Soft glow behind the text so it stands out */
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
            letter-spacing: 2px;
        }

        /* The Vibrant Blue Button */
        .next-btn {
            background: linear-gradient(45deg, #0055ff, #00aaff); /* Blue gradient */
            color: white;
            border: 2px solid #ffffff; /* White border to tie it together */
            padding: 18px 60px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none; 
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0, 85, 255, 0.5);
            transition: all 0.3s ease;
            font-family: 'Arial', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .next-btn:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 15px 35px rgba(0, 85, 255, 0.7);
            background: linear-gradient(45deg, #00aaff, #0055ff);
        }
        
        .next-btn:active {
            transform: translateY(2px) scale(0.95);
            box-shadow: 0 5px 15px rgba(0, 85, 255, 0.5);
        }

        /* Background Floating Hearts */
        .heart-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .mini-heart {
            position: absolute;
            opacity: 0;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; }
        }
        
        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .big-heart { font-size: 120px; }
            .main-text { font-size: 4rem; -webkit-text-stroke: 2px #ffffff; }
            .next-btn { padding: 15px 40px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="heart-container" id="heart-container"></div>

    <div class="content-wrapper">
        <div class="big-heart">❤</div>
        <div class="main-text">XYZ</div>
        <a href="page1.html" class="next-btn">XYZ</a>
    </div>

    <script>
        function createMiniHeart() {
            const container = document.getElementById('heart-container');
            const heart = document.createElement('div');
            heart.classList.add('mini-heart');
            heart.innerHTML = '❤';

            // Keeping colors strictly in the bright pink and white family to match the theme
            const colors = ['#ffffff', '#ff99cc', '#ff3385', '#ffb3d9'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            const size = Math.random() * 40 + 15; 
            const left = Math.random() * 100; 
            const duration = Math.random() * 5 + 3; 

            heart.style.color = randomColor;
            heart.style.fontSize = size + 'px';
            heart.style.left = left + 'vw';
            heart.style.animation = `floatUp ${duration}s ease-in infinite`;

            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Creates a steady stream of beautiful background hearts
        setInterval(createMiniHeart, 300);
    </script>
</body>
</html>
