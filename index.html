<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Rich, Fully Pink Animated Background */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle, #ff66a3, #ff1a75, #cc0052);
            background-size: 200% 200%;
            animation: pinkPulse 6s ease-in-out infinite alternate;
            overflow: hidden; 
            perspective: 1000px;
        }

        @keyframes pinkPulse {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Centered Box */
        .center-wrapper {
            position: absolute;
            top: 35%; 
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none; /* Lets touches pass through to the burst effect */
        }

        /* The transparent box */
        .text-container {
            background: rgba(255, 255, 255, 0.25); 
            padding: 25px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); 
            text-align: center;
        }

        /* The Main Text - Transparent with white outline */
        .main-text {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem; 
            margin: 0;
            color: transparent; 
            -webkit-text-stroke: 2px #ffffff; 
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            letter-spacing: 2px;
            min-height: 70px;
        }

        .cursor {
            color: #ffffff;
            animation: blink 1s infinite;
            -webkit-text-stroke: 0px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Scratch Button Wrapper */
        .bottom-wrapper {
            position: absolute;
            bottom: 70px; 
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20; 
        }

        /* Instruction text */
        .scratch-hint {
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Arial', sans-serif;
            font-size: 1rem;
            margin-bottom: 10px;
            animation: floatHint 2s infinite alternate;
            pointer-events: none;
        }

        @keyframes floatHint {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        /* The Blue Heart Button */
        .heart-btn {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 140px; 
            height: 140px;
            cursor: pointer;
            touch-action: none; /* CRITICAL: Prevents screen scrolling while scratching */
            animation: pulseBtn 1.5s infinite;
        }

        .heart-btn svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            fill: #0077ff; /* Vivid blue */
            filter: drop-shadow(0 5px 15px rgba(0, 119, 255, 0.6));
            z-index: 1;
            transition: filter 0.1s ease;
        }

        .btn-text {
            position: relative;
            z-index: 2; 
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: -15px; 
            pointer-events: none; 
        }

        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Custom Footer: Transparent text with solid blue heart */
        .footer-text {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-family: 'Arial', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 10;
            pointer-events: none;
        }

        /* Makes just the words transparent with a white outline */
        .transparent-words {
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.8);
        }

        /* Background and Magic Animation layers */
        .heart-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        
        .magic-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
        }

        .mini-heart {
            position: absolute;
            opacity: 0;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.7));
        }

        /* Animation: Starts at bottom (small) and floats up (increasing in size) */
        @keyframes popUpwards {
            0% { transform: translateY(110vh) scale(0.2); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(2.0); opacity: 0; }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .text-container { padding: 20px 30px; }
            .main-text { font-size: 2.5rem; -webkit-text-stroke: 1.5px #ffffff; }
            .bottom-wrapper { bottom: 60px; }
            .heart-btn { width: 120px; height: 120px; }
            .btn-text { font-size: 1.2rem; margin-top: -10px; }
            .center-wrapper { top: 35%; } 
            .footer-text { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="heart-container" id="heart-container"></div>
    <div class="magic-layer" id="magic-layer"></div>

    <div class="center-wrapper">
        <div class="text-container" id="tilt-box">
            <div class="main-text" id="typewriter-text"></div>
        </div>
    </div>
    
    <div class="bottom-wrapper">
        <div class="scratch-hint">Scratch the blue heart to open...</div>
        <div class="heart-btn" id="scratch-btn" aria-label="Next Page">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" id="heart-svg">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span class="btn-text">XYZ</span>
        </div>
    </div>

    <div class="footer-text">
        <span class="transparent-words">made with</span> 💙 <span class="transparent-words">by parm</span>
    </div>

    <script>
        // --- 1. TYPEWRITER EFFECT (FIXED) ---
        const textElement = document.getElementById('typewriter-text');
        const textToType = "XYZ"; 
        let typeIndex = 0;

        function typeWriter() {
            if (!textElement) return;
            if (typeIndex < textToType.length) {
                textElement.innerHTML = textToType.substring(0, typeIndex + 1) + '<span class="cursor">|</span>';
                typeIndex++;
                setTimeout(typeWriter, 150); 
            } else {
                textElement.innerHTML = textToType; 
            }
        }
        setTimeout(typeWriter, 500); 

        // --- 2. BACKGROUND HEARTS: POPPING UP & GROWING (FIXED) ---
        function createMiniHeart() {
            const container = document.getElementById('heart-container');
            if (!container) return;
            const heart = document.createElement('div');
            heart.classList.add('mini-heart');
            heart.innerHTML = '❤';
            const colors = ['#ffffff', '#ffffff', '#ff0000', '#ff1a75'];
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];
            
            // Random horizontal start position
            heart.style.left = (Math.random() * 100) + 'vw';
            
            // Starts small, animation will make it grow
            heart.style.fontSize = '20px'; 
            
            const duration = Math.random() * 3 + 3; // 3 to 6 seconds to float up
            heart.style.animation = `popUpwards ${duration}s ease-in infinite`;
            
            container.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }
        // Runs incredibly fast to fill the screen
        setInterval(createMiniHeart, 150);

        // --- 3. HIGH-SENSITIVITY TOUCH HEARTBURST (FIXED) ---
        let musicStarted = false;
        const magicLayer = document.getElementById('magic-layer');

        function createBurst(x, y) {
            // Trigger Music
            if (!musicStarted) {
                const bgMusic = document.getElementById('bg-music');
                if(bgMusic) bgMusic.play().catch(() => {});
                musicStarted = true;
            }

            for (let i = 0; i < 15; i++) {
                const burstHeart = document.createElement('div');
                burstHeart.innerHTML = '❤';
                burstHeart.style.position = 'absolute';
                burstHeart.style.left = x + 'px';
                burstHeart.style.top = y + 'px';
                burstHeart.style.color = Math.random() > 0.5 ? '#ffffff' : '#ff0000';
                burstHeart.style.fontSize = (Math.random() * 25 + 10) + 'px';
                burstHeart.style.pointerEvents = 'none';
                burstHeart.style.transition = 'all 0.8s cubic-bezier(0.1, 0.8, 0.3, 1)';
                magicLayer.appendChild(burstHeart);

                setTimeout(() => {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 80 + 30; 
                    burstHeart.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0)`;
                    burstHeart.style.opacity = '0';
                }, 10);

                setTimeout(() => burstHeart.remove(), 800);
            }
        }

        // Works universally on Mouse and Touch screens instantly
        document.addEventListener('mousedown', (e) => {
            // Don't burst if they are clicking the button
            if (!e.target.closest('#scratch-btn')) {
                createBurst(e.clientX, e.clientY);
            }
        });
        
        document.addEventListener('touchstart', (e) => {
            if (!e.target.closest('#scratch-btn')) {
                createBurst(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });


        // --- 4. SCRATCH TO OPEN LOGIC (FIXED) ---
        const scratchBtn = document.getElementById('scratch-btn');
        const heartSvg = document.getElementById('heart-svg');
        let scratchProgress = 0;
        const scratchThreshold = 25; // amount of scratching needed
        let isRedirecting = false;

        function triggerNextPage() {
            if (isRedirecting) return;
            isRedirecting = true;
            
            // Magical zoom out before leaving
            scratchBtn.style.transform = 'scale(2)';
            scratchBtn.style.opacity = '0';
            scratchBtn.style.transition = 'all 0.6s ease-out';
            
            setTimeout(() => {
                window.location.href = 'page1.html';
            }, 600);
        }

        function handleScratch() {
            if (isRedirecting) return;
            scratchProgress++;

            // Make the blue heart glow brighter the more it is scratched
            const intensity = Math.min(scratchProgress / scratchThreshold, 1);
            heartSvg.style.filter = `drop-shadow(0 0 ${15 + (intensity * 40)}px rgba(255, 255, 255, 0.9)) hue-rotate(${intensity * 30}deg)`;

            if (scratchProgress >= scratchThreshold) {
                triggerNextPage();
            }
        }

        // Touch Scratch (Mobile) - "passive: false" is critical to stop screen scrolling
        scratchBtn.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            handleScratch();
        }, { passive: false });

        // Mouse Scratch (Laptop)
        scratchBtn.addEventListener('mousemove', (e) => {
            if (e.buttons > 0) { // Only works if mouse is held down
                handleScratch();
            }
        });

        // Backup Click: If they just tap it rapidly, it still works
        scratchBtn.addEventListener('click', () => {
            scratchProgress += 5; 
            handleScratch();
        });
    </script>
</body>
</html>
