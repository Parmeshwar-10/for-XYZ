<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal</title>
    
    <!-- Beautiful cursive font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Rich, Fully Pink Animated Background */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle, #ff66a3, #ff1a75, #cc0052);
            background-size: 200% 200%;
            animation: pinkPulse 6s ease-in-out infinite alternate;
            overflow: hidden; 
        }

        @keyframes pinkPulse {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Perfectly centered text container */
        .center-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Normal rectangular box, no blur effects to prevent browser line glitches */
        .text-container {
            background: rgba(255, 255, 255, 0.25); /* Clean, semi-transparent white */
            padding: 40px 70px;
            border-radius: 20px;
            border: none; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Soft shadow just on the box */
            text-align: center;
        }

        /* The Transparent Text with White Outline */
        .main-text {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem; 
            margin: 0;
            color: transparent; 
            -webkit-text-stroke: 3px #ffffff; 
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            letter-spacing: 2px;
        }

        /* Wrapper to lock the button directly to the bottom */
        .bottom-wrapper {
            position: absolute;
            bottom: 40px; /* Distance from the bottom of the screen */
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        /* The Heart-Shaped Button containing text */
        .heart-btn {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 140px; 
            height: 140px;
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: pulseBtn 1.5s infinite;
            text-decoration: none; 
        }

        .heart-btn svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            fill: #ff0000; /* Bright Red heart */
            filter: drop-shadow(0 10px 20px rgba(255, 0, 0, 0.5));
            z-index: 1;
        }

        /* Text inside the Heart Button */
        .btn-text {
            position: relative;
            z-index: 2; /* Keeps text above the heart shape */
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'Arial', sans-serif;
            margin-top: -15px; /* Adjusts text visually to center of heart */
        }

        /* Button Hover and Click Effects */
        .heart-btn:hover {
            transform: scale(1.15);
        }
        
        .heart-btn:active {
            transform: scale(0.9);
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Background Floating Hearts */
        .heart-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .mini-heart {
            position: absolute;
            opacity: 0;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.7));
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; }
        }
        
        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .text-container { padding: 30px 40px; }
            .main-text { font-size: 3.5rem; -webkit-text-stroke: 2px #ffffff; }
            .bottom-wrapper { bottom: 25px; }
            .heart-btn { width: 120px; height: 120px; }
            .btn-text { font-size: 1.2rem; margin-top: -10px; }
        }
    </style>
</head>
<body>

    <!-- Dynamic Background Hearts -->
    <div class="heart-container" id="heart-container"></div>

    <!-- Centered Text Area (No vertical lines!) -->
    <div class="center-wrapper">
        <div class="text-container">
            <div class="main-text">XYZ</div>
        </div>
    </div>
    
    <!-- Heart Shaped Button Locked to the Bottom -->
    <div class="bottom-wrapper">
        <a href="page1.html" class="heart-btn" aria-label="Next Page">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span class="btn-text">XYZ</span>
        </a>
    </div>

    <!-- JavaScript for Lots of Popping Background Hearts -->
    <script>
        function createMiniHeart() {
            const container = document.getElementById('heart-container');
            const heart = document.createElement('div');
            heart.classList.add('mini-heart');
            heart.innerHTML = '❤';

            // Mostly white hearts, with a few red ones mixed in
            const colors = ['#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ff0000', '#ff1a75'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            const size = Math.random() * 40 + 15; 
            const left = Math.random() * 100; 
            const duration = Math.random() * 4 + 3; // Float up naturally

            heart.style.color = randomColor;
            heart.style.fontSize = size + 'px';
            heart.style.left = left + 'vw';
            heart.style.animation = `floatUp ${duration}s ease-in infinite`;

            container.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Running every 80 milliseconds to ensure max hearts
        setInterval(createMiniHeart, 80);
    </script>
</body>
</html>
